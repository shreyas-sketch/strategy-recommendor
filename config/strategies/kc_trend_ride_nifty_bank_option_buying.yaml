  \ runtime variable 'BANKNIFTY_key1' (set outside this strategy) equals 2 OR runtime variable 'BANKNIFTY_key2' (set\
  \ outside this strategy) equals 1.\n\nSet 2:\n  Entry when runtime variable 'BANKNIFTY_key2' (set outside this strategy)\
  \ equals 1.\n    -> BUY 1 lot NIFTY BANK PE ATM (current month expiry, NRML)\n  Exit when runtime variable 'BANKNIFTY_key2'\
  \ (set outside this strategy) equals 2 OR runtime variable 'BANKNIFTY_key1' (set outside this strategy) equals 1.\n\
  \nAll sets:\n  Exit everything when the time is at or after 15:15."
