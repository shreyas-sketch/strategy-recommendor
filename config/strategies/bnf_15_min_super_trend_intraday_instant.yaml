description: Directional option buying (trend following) on NIFTY BANK (intraday) using Supertrend.
logic: "Style: Directional option buying (trend following) on NIFTY BANK.\nIntraday: everything is closed by 15:14\
  \ IST.\nIndicators used: Supertrend.\nCapital required (per Tradetron): ₹100,000.\n\nSet 1:\n  Entry when (close\
  \ of NIFTY BANK (spot/index) 15m candles on the last completed candle is above Supertrend(10, 3) of NIFTY BANK\
  \ (spot/index) 15m candles on the last completed candle AND the time is at or after 09:30) OR (the time is at\
  \ or after 09:16 AND the time is before 09:30 AND close of NIFTY BANK (spot/index) 15m candles on the current\
  \ (forming) candle is above Supertrend(10, 3) of NIFTY BANK (spot/index) 15m candles on the current (forming)\
  \ candle AND open CE quantity on NIFTY BANK equals 0).\n    -> BUY 1 lot NIFTY BANK CE ATM+2 strike (spot-based)\
  \ = 2 strikes out of the money (current month expiry, intraday (MIS))\n  Exit when close of NIFTY BANK (spot/index)\
  \ 15m candles on the last completed candle is below Supertrend(10, 3) of NIFTY BANK (spot/index) 15m candles on\
  \ the last completed candle AND the time is at or after 09:31.\n\nSet 2:\n  Entry when (close of NIFTY BANK (spot/index)\
  \ 15m candles on the last completed candle is below Supertrend(10, 3) of NIFTY BANK (spot/index) 15m candles on\
  \ the last completed candle AND the time is at or after 09:30) OR (the time is at or after 09:16 AND the time\
  \ is before 09:30 AND close of NIFTY BANK (spot/index) 15m candles on the current (forming) candle is below Supertrend(10,\
  \ 3) of NIFTY BANK (spot/index) 15m candles on the current (forming) candle AND open PE quantity on NIFTY BANK\
  \ equals 0).\n    -> BUY 1 lot NIFTY BANK PE ATM-2 strike (spot-based) = 2 strikes out of the money (current month\
  \ expiry, intraday (MIS))\n  Exit when close of NIFTY BANK (spot/index) 15m candles on the last completed candle\
  \ is above Supertrend(10, 3) of NIFTY BANK (spot/index) 15m candles on the last completed candle AND the time\
  \ is at or after 09:31.\n\nAll sets:\n  Exit everything when the time is at or after 15:14."
