description: 'Directional in-the-money option selling on NIFTY BANK (intraday): 5-min Supertrend(10,3) — sells an
  ITM put in uptrends and an ITM call in downtrends.'
logic: "Style: Directional option selling on NIFTY BANK.\nIntraday: everything is closed by 15:15 IST.\nIndicators\
  \ used: Supertrend.\nCapital required (per Tradetron): ₹225,000.\nTradetron tags: EarnTheta, ShortVol, Directional,\
  \ Positional.\n\nSet 1:\n  Entry when close of NIFTY BANK (spot/index) 5m candles on the last completed candle\
  \ is above Supertrend(10, 3) of NIFTY BANK (spot/index) 5m candles on the last completed candle AND the time is\
  \ at or after 09:20.\n    -> SELL 1 lot NIFTY BANK PE ATM+2 strike (spot-based) = 2 strikes in the money (current\
  \ month expiry, intraday (MIS))\n  Exit when close of NIFTY BANK (spot/index) 5m candles on the last completed\
  \ candle is below Supertrend(10, 3) of NIFTY BANK (spot/index) 5m candles on the last completed candle AND the\
  \ time is at or after 09:20.\n\nSet 2:\n  Entry when close of NIFTY BANK (spot/index) 5m candles on the last completed\
  \ candle is below Supertrend(10, 3) of NIFTY BANK (spot/index) 5m candles on the last completed candle AND the\
  \ time is at or after 09:20.\n    -> SELL 1 lot NIFTY BANK CE ATM-2 strike (spot-based) = 2 strikes in the money\
  \ (current month expiry, intraday (MIS))\n  Exit when close of NIFTY BANK (spot/index) 5m candles on the last\
  \ completed candle is above Supertrend(10, 3) of NIFTY BANK (spot/index) 5m candles on the last completed candle\
  \ AND the time is at or after 09:20.\n\nAll sets:\n  Exit everything when the time is at or after 15:15."
