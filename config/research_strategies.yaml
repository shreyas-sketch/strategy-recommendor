# The deployed strategies the research module evaluates. Seeded into data/research/research.db on first
# start (each id once); edit them afterwards in Admin → Strategy research → Data.
#
# margin              capital the Tradetron P&L is earned on (Rs)
# cost_per_active_day estimated statutory/exchange charges on a day it trades, used only when an uploaded
#                     P&L file has no charges column. From each deployment's Tradetron "Cost Lab":
#                     estimated costs ÷ (win days + loss days).
# underlying          the index whose market regime describes the strategy

