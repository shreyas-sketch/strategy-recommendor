<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Strategy Recommender</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header><div class="wrap"><h1>Strategy Recommender</h1></div></header>
<main class="wrap narrow">
  <section class="card">
    <h2>Sign in</h2>
    <div id="google-box" class="hidden">
      <a class="google-btn" href="/auth/google/start">Sign in with Google</a>
      <p class="or">or with your mobile number</p>
    </div>
    <form id="login-form">
      <label for="phone">Mobile number</label>
      <input id="phone" type="tel" autocomplete="username" required placeholder="98XXXXXXXX" class="block">
      <label for="password" style="margin-top:12px">Password</label>
      <input id="password" type="password" autocomplete="current-password" required class="block">
      <div id="error" class="error hidden" style="margin-top:12px"></div>
      <button class="primary block" style="margin-top:16px">Sign in</button>
    </form>
    <p class="muted small">Use "Sign in with Google" if the admin registered your Gmail address. Otherwise use the invite link the admin sent you; forgot your password? Ask the admin for a new invite link.</p>
  </section>
</main>
<script src="/static/common.js"></script>
<script src="/static/login.js"></script>
</body>
</html>
